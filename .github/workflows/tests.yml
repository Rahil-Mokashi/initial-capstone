name: Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    # windows-latest, not ubuntu: this app targets Windows (PyInstaller
    # build, PySide6 desktop app) and its GitHub-hosted runner has a
    # real display session, unlike Linux runners which need a virtual
    # one (Xvfb) - some of this suite's tests assert on real Qt focus
    # state (e.g. tests/test_login_ui.py's Enter-key navigation test),
    # which only behaves correctly with a genuine window session.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Split into a few sequential invocations rather than one
      # `pytest tests/` run covering all ~450 tests: PySide6 accumulates
      # native Qt resources (widgets, timers, window handles) across the
      # ~15+ test modules that construct a QApplication, and running the
      # entire suite as one long-lived process can hit a native resource
      # crash near the end - reproduced locally, and confirmed to
      # disappear once the same tests run in a few smaller batches
      # instead. Glob-based (not a hardcoded file list) so a newly added
      # test file automatically lands in one of these batches without
      # needing this file updated.
      # shell: bash (not the windows-latest default of PowerShell) so
      # the [a-i] glob is expanded by the shell exactly as verified
      # locally - PowerShell doesn't expand wildcards in arguments to
      # external commands the way a POSIX shell does.
      - name: Run tests (a-i)
        shell: bash
        run: python -m pytest tests/test_[a-i]*.py -q

      - name: Run tests (j-p)
        shell: bash
        run: python -m pytest tests/test_[j-p]*.py -q

      - name: Run tests (q-r)
        shell: bash
        run: python -m pytest tests/test_[q-r]*.py -q

      - name: Run tests (s-z)
        shell: bash
        run: python -m pytest tests/test_[s-z]*.py -q
