# NSIS installer for the new Electron app. The Qt app's Inno Setup installer is untouched.
appId: com.petrolpumperp.desktop
productName: Petrol Pump ERP
copyright: Petrol Pump ERP
directories:
  output: release
afterPack: scripts/after-pack.cjs
files:
  - dist/**
  - package.json
asar: true
extraResources:
  # The Python API, frozen by PyInstaller (api/pperp_api.spec) - a SEPARATE executable Electron spawns.
  - from: sidecar-dist/pperp-api
    to: api
  # The built web UI, served by the sidecar.
  - from: ../web/dist
    to: web
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: true
  # No code signing yet (deferred): keep resource editing (icon, version, asar integrity digest) but never sign.
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Like the Qt installer: uninstalling must never delete the database or any historical data.
  deleteAppDataOnUninstall: false
  # Short default install folder (%LOCALAPPDATA%\PPERP) - see build/installer.nsh.
  include: build/installer.nsh
