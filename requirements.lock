# ---------------------------------------------------------------------
# LOCK FILE - exact versions, generated 2026-08-17
#
# requirements.txt declares WHAT this project depends on, with loose
# ranges. This file records the exact versions those ranges actually
# resolved to on a machine where the full test suite passes and a
# working .exe was built. Install from this file for CI, for release
# builds, and any time a build must be reproducible.
#
# HOW THIS WAS GENERATED, because `pip freeze` is the wrong tool here:
# this project runs on the global Python installation, so freeze reports
# roughly 190 packages - jupyter, fastapi, twilio, scikit-learn and more
# - that the application never imports. Pinning those would misdescribe
# the project and drag unrelated upgrades into every build. Instead this
# is the transitive closure of the declared dependencies only, walked
# through installed package metadata with environment markers evaluated
# for Windows/CPython, then pinned at the installed version.
#
# TO REGENERATE after changing requirements.txt: install the new
# dependency, confirm the suite still passes, then re-run the closure
# walk rather than hand-editing a version here - a hand-edit can pin a
# version whose own dependencies were never resolved.
#
# HASH-PINNED. Every requirement carries the sha256 of each published
# distribution for that version, so pip verifies what it downloaded
# actually is what was locked. This defends against a tampered or
# substituted artifact on the package index, not just against a version
# drifting - and pip switches into --require-hashes mode automatically
# as soon as any requirement has a hash, which is why the file has to be
# a complete dependency closure rather than only the direct dependencies.
#
# Several hashes are listed per requirement on purpose: they cover every
# distribution PyPI publishes for that version, so the lock still
# installs on a different Python minor version or architecture instead
# of failing there. Hashes come from PyPI's published metadata (the same
# digests pip verifies against), so regenerating does not mean
# downloading half a gigabyte of wheels.
# ---------------------------------------------------------------------

